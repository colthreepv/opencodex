name: Personal build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-personal.*'

permissions:
  contents: read

concurrency:
  group: personal-build
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'colthreepv/opencodex' && (github.ref == 'refs/heads/personal' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-personal.')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact build commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Validate personal version and release tag
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          bun scripts/release-version-sources.ts check
          node <<'NODE'
          const version = require('./package.json').version;
          if (!/^\d+\.\d+\.\d+-personal\.\d+$/.test(version)) throw new Error('Expected a personal version');
          if (process.env.BUILD_REF.startsWith('refs/tags/') && process.env.BUILD_TAG !== `v${version}`) {
            throw new Error('Release tag does not match package version');
          }
          NODE

      - name: Check personal build contract
        run: bun test tests/ci-workflows/personal-build.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build dashboard and prepare package
        run: bun run build:gui

      - name: Pack without publishing
        run: |
          mkdir -p dist/personal
          npm pack --ignore-scripts --pack-destination dist/personal

      - name: Record build provenance
        env:
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_REF: ${{ github.ref }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const provenance = {
            kind: 'personal-fork',
            repository: process.env.BUILD_REPOSITORY,
            ref: process.env.BUILD_REF,
            commit: process.env.BUILD_COMMIT,
            version: pkg.version,
          };
          fs.writeFileSync('dist/personal/provenance.json', JSON.stringify(provenance, null, 2) + '\n');
          fs.copyFileSync('personal.md', 'dist/personal/personal.md');
          NODE
          cd dist/personal
          sha256sum *.tgz provenance.json personal.md > SHA256SUMS

      - name: Upload personal package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencodex-personal-${{ github.sha }}
          path: dist/personal/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.repository == 'colthreepv/opencodex' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-personal.')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified package from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencodex-personal-${{ github.sha }}
          path: dist/personal/

      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd dist/personal
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tgz SHA256SUMS provenance.json personal.md \
            --verify-tag --latest --title "$RELEASE_TAG" \
            --notes "Personal fork based on upstream v2.100.0. Includes OpenCode Responses/Connect, Responses instruction normalization, ScribeTray dictation fixes, and native model display names. Source commit: $RELEASE_COMMIT. Install the npm tarball manually. No standalone executables or desktop installers are included. Do not use the upstream npm updater to replace this fork."
